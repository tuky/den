name: Check den

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  system:
    name: Build ${{ matrix.host }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: macbook
            runner: macos-26
            system: aarch64-darwin
            target: darwinConfigurations.macbook.system
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify runner and local identity
        env:
          EXPECTED_SYSTEM: ${{ matrix.system }}
        run: |
          test "$(nix eval --impure --raw --expr builtins.currentSystem)" = "$EXPECTED_SYSTEM"
          # den reads these values during impure system evaluation.
          echo "DEN_USER=$(id -un)" >> "$GITHUB_ENV"
          test -n "$HOME"
          echo "DEN_HOME=$HOME" >> "$GITHUB_ENV"

      - name: Check shell syntax
        run: bash -n scripts/den.sh

      - name: Test CLI identity and dispatch
        run: python3 -m unittest discover -s tests

      - name: Check flake
        run: nix flake check --impure --no-update-lock-file --show-trace

      # Build each host explicitly; flake checking alone is insufficient.
      - name: Build system and Home Manager configuration
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: nix build --impure --no-update-lock-file --no-link --print-build-logs ".#${BUILD_TARGET}"

  ci:
    name: CI
    needs: system
    # Run even when a build fails or is skipped; a skipped gate can satisfy rules.
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every matrix build to succeed
        env:
          BUILD_RESULT: ${{ needs.system.result }}
        run: test "$BUILD_RESULT" = success
